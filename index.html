<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurfScape</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header id="main-header">
        <div class="logo-container" onclick="showOverview()">
            <h1 id="site-logo">SurfScape</h1>
        </div>
        <div id="sub-header-info" class="sub-header hidden">
            <span id="detail-location-country"></span>
        </div>
    </header>

    <!-- Hauptbereich -->
    <main>
        <!-- Ansicht 1: Startseite / Grid -->
        <section id="overview-section">
            <div class="webcam-grid" id="webcam-grid">
                <!-- Dynamisch per JS generiert -->
            </div>
        </section>

        <!-- Ansicht 2: Detailansicht -->
        <section id="detail-section" class="hidden">
            <div class="detail-container">
                <div class="detail-video-wrapper">
                    <iframe id="detail-iframe" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>

                <!-- Wetter- & Wellenwerte laut Vorlage -->
                <div class="weather-metrics-container">
                    <div class="metric-card">
                        <span class="metric-value" id="val-air">-- °C</span>
                        <span class="metric-label">Lufttemperatur</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-value" id="val-water">-- °C</span>
                        <span class="metric-label">Wassertemperatur</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-value" id="val-wave">-- m</span>
                        <span class="metric-label">Wellenhöhe</span>
                    </div>
                </div>

                <button class="back-button" onclick="showOverview()">← Zurück zur Übersicht</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
